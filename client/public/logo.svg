<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="24" fill="#0F172A" />
  <!-- Dynamic Orbital Rings -->
  <ellipse cx="50" cy="50" rx="34" ry="14" stroke="url(#orbitGrad)" stroke-width="4.5" transform="rotate(-30 50 50)" stroke-dasharray="8 3" opacity="0.9" />
  <ellipse cx="50" cy="50" rx="34" ry="14" stroke="url(#orbitGrad)" stroke-width="4.5" transform="rotate(35 50 50)" opacity="0.8" />
  <!-- Central Glowing Node -->
  <circle cx="50" cy="50" r="12" fill="url(#coreGrad)" />
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
  <!-- Orbiting Satellites / Nodes -->
  <circle cx="78" cy="34" r="4.5" fill="#38BDF8" />
  <circle cx="22" cy="66" r="3.5" fill="#818CF8" />
</svg>
